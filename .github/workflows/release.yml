name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0 — no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate, tag & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Validate build
        working-directory: mcp-server
        run: |
          npm ci
          npm run typecheck
          npm run build
          test -f dist/index.js

      - name: Validate manifests agree with each other and with the release input
        run: |
          bash scripts/check-manifest-version-alignment.sh . --manifests-only
          MANIFEST_VER=$(jq -r .version .claude-plugin/plugin.json)
          if [[ "$MANIFEST_VER" != "${{ inputs.version }}" ]]; then
            echo "::error::plugin.json version ($MANIFEST_VER) does not match release input (${{ inputs.version }}) — bump manifests in a PR first, then release that exact version"
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "See CHANGELOG.md for details of this release."
